<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="robots" content="noindex">
<title>問題の詳細 - Grid Loop 管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f5e'/%3E%3Cpath d='M8 11h9v10h7' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<link rel="stylesheet" href="../src/ui/styles.css">
</head>
<body class="admin-page">
<div class="admin">
  <header class="admin-head">
    <h1 class="logo"><span class="logo-mark" aria-hidden="true"></span>Grid Loop 管理</h1>
    <a class="admin-back" href="../admin.html"><span class="mi" aria-hidden="true">arrow_back</span>問題集へ</a>
    <div class="admin-account" id="admin-account"></div>
  </header>

  <section class="admin-gate" id="admin-gate">
    <p id="gate-text">確かめています…</p>
    <div class="login-google" id="gate-login"></div>
  </section>

  <!-- 1 問の詳細：盤（答えも見られる）・情報と目安・くわしい解き味 -->
  <main class="admin-page-main admin-detail" id="admin-main" hidden>
    <nav class="admin-detail-nav">
      <a class="admin-link" id="to-list" href="problems.html"><span class="mi" aria-hidden="true">table_rows</span>問題一覧へ</a>
      <a class="admin-link" id="to-book"><span class="mi" aria-hidden="true">menu_book</span>問題集で開く</a>
      <span class="admin-spacer"></span>
      <a class="admin-link" id="prev" hidden><span class="mi" aria-hidden="true">chevron_left</span>前の問題</a>
      <a class="admin-link" id="next" hidden>次の問題<span class="mi" aria-hidden="true">chevron_right</span></a>
    </nav>
    <h2 id="detail-title">読み込んでいます…</h2>
    <div class="admin-detail-body" id="detail-body" hidden>
      <figure class="admin-detail-board">
        <div id="board"></div>
        <figcaption>
          <label class="admin-check"><input type="checkbox" id="show-answer" disabled> 答えを見せる</label>
          <span class="admin-spacer"></span>
          <a class="admin-link" id="play" target="_blank" rel="noopener"><span class="mi" aria-hidden="true">play_arrow</span>遊ぶ</a>
        </figcaption>
      </figure>
      <div class="admin-detail-info">
        <h3>この問題について</h3>
        <dl class="admin-facts" id="facts"></dl>
        <h3>目安</h3>
        <dl class="admin-facts" id="metrics"></dl>
        <h3>教師データ <small id="nikoli-verdict"></small></h3>
        <ul class="admin-nikoli" id="nikoli"></ul>
      </div>
    </div>
    <section class="admin-detail-report" id="report-section" hidden>
      <h3>くわしい解き味</h3>
      <div class="puzzle-report" id="report"><p class="report-wait">解き進めて調べています…</p></div>
    </section>
  </main>
</div>
<script type="module" src="../src/ui/admin-problem.js"></script>
</body>
</html>
