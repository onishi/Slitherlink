# GitHub Pages への公開。ふだんの公開は Cloudflare (cloudflare.yml) が担当するので、
# こちらは必要なときだけ Actions タブから手動で実行する。
# 実行前に Settings -> Pages -> Source を GitHub Actions にしておくこと。
name: GitHub Pages への公開（手動）

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 単体テスト
        run: npm test
      - name: 作問の検証（論理的可解性と解の一意性）
        run: node tools/verify.js 1

  build:
    name: サイトの組み立て
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 公開用ファイルを用意
        run: npm run build:site
      # Pages サイトそのものの作成は GITHUB_TOKEN の権限では行えないため
      # (configure-pages の enablement: true は "Resource not accessible by
      # integration" で失敗する)、初回だけ Settings → Pages での有効化が必要。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
